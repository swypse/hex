<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hex</title>
  <style>
    @font-face {
      font-family: 'Roboto';
      src: url('/fonts/Roboto-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Roboto';
      src: url('/fonts/Roboto-Black.ttf') format('truetype');
      font-weight: 700 900;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #1a1a2e; color: #eee; font-family: 'Roboto', system-ui, sans-serif; overflow: hidden; }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .hidden { display: none !important; }
    button {
      font-size: 16px; padding: 8px 16px; cursor: pointer; border-radius: 4px; border: none;
      background: #3a3f5a; color: #eee; transition: background 0.15s, transform 0.06s, filter 0.15s;
    }
    button:hover:not(:disabled) { background: #4a5070; filter: brightness(1.08); }
    button:active:not(:disabled) { transform: scale(0.96); }
    button:disabled { opacity: 0.5; cursor: default; }
    button.selected { outline: 3px solid #fff; }
    #game-root canvas { touch-action: none; }
    button, #skills-btn { touch-action: manipulation; }
    #game-root { position: absolute; inset: 0; }
    #players-list { position: absolute; top: 52px; left: 8px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 4px; }
    #skills-btn { position: absolute; top: 22px; right: 84px; }
    #score-info {
      position: absolute; top: 8px; right: 8px;
      width: 64px; height: 64px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffe98a, #d4a017);
      color: #1a1a2e; font-size: 24px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      z-index: 5;
    }
    .score-bounce { display: inline-block; animation: scorePop 0.3s ease; }
    @keyframes scorePop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    #turn-info { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 4px; }
    #money-info { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 4px; }
    .money-bounce { display: inline-block; animation: moneyPop 0.3s ease; }
    @keyframes moneyPop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    #selected-info { position: absolute; bottom: 16px; left: 16px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 4px; }
    #end-turn-btn { position: absolute; bottom: 16px; right: 16px; }
    #action-toolbar { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
    #popup-stack { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 1em; z-index: 10; max-width: 15vw; width: fit-content; }
    #popup-stack .popup { padding: 8px 12px; border-radius: 4px; color: #fff; display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; }
    #popup-stack .popup .popup-close { background: none; border: none; color: #fff; font-size: 14px; cursor: pointer; padding: 0; }
    @media (max-width: 600px) {
      button { font-size: 18px; padding: 12px 20px; min-height: 44px; }
      #score-info { width: 48px; height: 48px; font-size: 18px; top: 4px; right: 4px; }
      #players-list { top: 44px; left: 4px; font-size: 12px; padding: 6px 10px; }
      #turn-info { top: 4px; left: 4px; font-size: 13px; padding: 6px 10px; }
      #money-info { top: 40px; font-size: 12px; padding: 3px 10px; }
      #skills-btn { top: 58px; right: 8px; }
      #end-turn-btn { bottom: 8px; right: 8px; }
      #action-toolbar { bottom: 8px; gap: 6px; }
      #action-toolbar button { padding: 10px 14px; }
      #selected-info { bottom: 76px; left: 8px; max-width: 45vw; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
